name: Demo

on:
  workflow_dispatch:

env:
  APP_NAME: SpringBoot

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Print Variables
        run: |
          echo $APP_NAME
          echo ${{ github.actor }}
          echo ${{ github.repository }}
          echo ${{ runner.os }}

      - name: Secret Example
        env:
          PASSWORD: ${{ secrets.DB_PASSWORD }}

        run: |
          echo "Secret Loaded Successfully"
